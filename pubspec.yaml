name: abd_shop
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1
environment:
  sdk: ^3.6.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  shamsi_date: ^1.0.4
  smooth_page_indicator: ^1.2.1
  flutter_spinkit: ^5.2.1
  permission_handler: ^11.4.0 # Add this package for the permission handler
  connectivity_plus: ^6.1.3   # Add this package for checking wifi and mobile data connectivity
  http: ^1.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  image_cropper: ^9.0.0
  dotted_border: ^2.1.0
  flutter_image_compress: ^2.4.0
  shimmer: ^3.0.0
  flutter_map: ^8.1.0
  latlong2: ^0.9.1
  geocoding: ^3.0.0
  lottie: ^3.3.1
  device_preview: ^1.2.0
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Yekan
      fonts:
        - asset: assets/fonts/Yekan.ttf